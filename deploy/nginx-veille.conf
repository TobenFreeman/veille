server {
    listen 80;
    server_name veille.tobenfreeman.dev;
    return 301 https://$server_name$request_uri;
}

server {
    # IP publique spécifique (pas de wildcard : tailscaled tient déjà le 443 ailleurs).
    listen 51.210.243.211:443 ssl;
    http2 on;
    server_name veille.tobenfreeman.dev;

    root /var/www/veille;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/veille.tobenfreeman.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veille.tobenfreeman.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # API Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3022;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets buildés : cache long (noms hashés par Vite).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html : jamais mis en cache (sinon on resert une ancienne version
    # qui pointe vers d'anciens assets après un déploiement).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA React : tout le reste retombe sur index.html (routing client).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
